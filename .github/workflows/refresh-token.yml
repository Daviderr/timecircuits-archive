# Renews the 60-day Instagram token on the 1st of every month and stores it back as a repo secret.
# Needs a fine-grained GitHub token (secret GH_SECRETS_PAT) with "Secrets: read and write" on this repo only.
name: Refresh Instagram token

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Refresh and store token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v23.0' }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          NEW=$(python scripts/publish.py --print-refreshed-token)
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "Token refreshed."
